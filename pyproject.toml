[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-project-controller"
version = "0.0.1"
description = "Provider-neutral AI project controller bootstrap"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
codex = ["openai-codex==0.160.0"]
reviewer = ["openai==3.24.0"]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.18,<5", "rfc3339-validator>=0.1.4"]

[project.scripts]
aipc = "aipc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
exclude = ["*.md"]
