name: AIPC Continuous Integration

on:
  push:
    branches:
      - master
      - 'codex/**'
      - 'claude/**'
      - 'gemini/**'
      - 'validation/**'
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks-and-tests:
    name: Fast Checks & Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff Lint Check
        run: ruff check .

      - name: Ruff Format Check
        run: ruff format --check .

      - name: Verify Domain and Project JSON Schemas
        run: |
          python -m aipc.domain.schemas --check
          python -m aipc.project.schemas --check

      - name: Build Wheel & Verify Isolation
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Run Fast Unit, Contract, Gemini, CLI, Hardening, Plugin & E2E Test Suites
        run: |
          git config --global user.name "AIPC CI"
          git config --global user.email "ci@aipc.local"
          python -m pytest tests/unit tests/contract tests/gemini tests/integration/test_cli.py tests/routing/test_router.py tests/routing/test_structure.py tests/consensus/test_consensus.py tests/observability/test_metrics.py tests/dashboard/test_dashboard.py tests/mcp/test_mcp_tools.py tests/hardening/test_production_hardening.py tests/plugins/test_plugin_extension_model.py tests/e2e/test_full_mock_e2e.py tests/e2e/test_provider_qualification_and_fallback.py -q -m "not live"
